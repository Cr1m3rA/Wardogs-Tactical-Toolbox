  <div id="app">
    <aside id="sidebar">
      <div class="brand">
        <span class="logo">W</span>
        <div class="brand-txt"><b>WARDOGS</b><small>战术工具箱</small></div>
      </div>
      <nav id="nav" aria-label="功能导航"></nav>
      <div class="side-foot">
        <div class="mono" id="cursorCoord">X — / Y —</div>
        <div id="tileStat" class="tile-stat">底图检测中…</div>
      </div>
    </aside>

    <div id="main">
      <header id="topbar">
        <sl-select id="mapSel" size="small" hoist></sl-select>
        <sl-select id="srcSel" size="small" hoist style="width:118px"></sl-select>
        <span class="tb-sep"></span>
        <sl-tooltip content="网格开/关"><sl-button id="btnGrid" size="small" class="tb-btn"><svg class="ico" aria-hidden="true"><use href="#i-grid-3x3"/></svg></sl-button></sl-tooltip>
        <sl-tooltip content="地标注隐"><sl-button id="btnPoi" size="small" class="tb-btn"><svg class="ico" aria-hidden="true"><use href="#i-layers"/></svg></sl-button></sl-tooltip>
        <sl-tooltip content="自定义标记显隐"><sl-button id="btnMarks" size="small" class="tb-btn"><svg class="ico" aria-hidden="true"><use href="#i-map-pin"/></svg></sl-button></sl-tooltip>
        <sl-tooltip content="整图缩放"><sl-button id="btnFit" size="small" class="tb-btn"><svg class="ico" aria-hidden="true"><use href="#i-maximize-2"/></svg></sl-button></sl-tooltip>
        <sl-tooltip content="导出 PNG 截图"><sl-button id="btnShot" size="small" class="tb-btn"><svg class="ico" aria-hidden="true"><use href="#i-camera"/></svg></sl-button></sl-tooltip>
        <span class="spacer"></span>
        <span id="hintBar"></span>
      </header>
      <div id="stage">
        <div id="mapWrap"><canvas id="map"></canvas></div>
        <aside id="panel"></aside>
      </div>
    </div>
  </div>

  <!-- 游戏内悬浮窗 HUD（?overlay=1 时启用） -->
  <div id="hud">
    <div id="hudMap"><canvas id="mapOv"></canvas></div>
    <div id="hudBar" data-tauri-drag-region>
      <sl-select id="hudMapSel" size="small" hoist style="width:116px"></sl-select>
      <span class="hud-kv"><i>方位</i><b id="hudAz">—</b></span>
      <span class="hud-kv"><i>距离</i><b id="hudDist">—</b></span>
      <span class="hud-kv mil"><i>密位</i><b id="hudMil">—</b></span>
      <span class="spacer"></span>
      <sl-button size="small" id="hudPut">放炮位/目标</sl-button>
      <sl-button size="small" variant="primary" id="hudCopy">复制口令</sl-button>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
